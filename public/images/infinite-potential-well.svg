<svg xmlns="http://www.w3.org/2000/svg" width="500" height="320" viewBox="0 0 500 320">
  <rect width="500" height="320" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
  <!-- Axes -->
  <line x1="60" y1="270" x2="460" y2="270" stroke="#404040" stroke-width="1.5"/>
  <line x1="60" y1="270" x2="60" y2="30" stroke="#404040" stroke-width="1.5"/>
  <!-- Arrow heads -->
  <polygon points="460,270 452,265 452,275" fill="#404040"/>
  <polygon points="60,30 55,38 65,38" fill="#404040"/>
  <!-- Axis labels -->
  <text x="470" y="275" font-family="serif" font-size="16" fill="#404040" font-style="italic">x</text>
  <text x="45" y="25" font-family="serif" font-size="16" fill="#404040" font-style="italic">V(x)</text>
  <!-- Infinite walls -->
  <line x1="120" y1="270" x2="120" y2="50" stroke="#171717" stroke-width="2.5"/>
  <line x1="380" y1="270" x2="380" y2="50" stroke="#171717" stroke-width="2.5"/>
  <!-- Hatching left wall -->
  <line x1="110" y1="60" x2="120" y2="50" stroke="#171717" stroke-width="1"/>
  <line x1="110" y1="80" x2="120" y2="70" stroke="#171717" stroke-width="1"/>
  <line x1="110" y1="100" x2="120" y2="90" stroke="#171717" stroke-width="1"/>
  <line x1="110" y1="120" x2="120" y2="110" stroke="#171717" stroke-width="1"/>
  <line x1="110" y1="140" x2="120" y2="130" stroke="#171717" stroke-width="1"/>
  <line x1="110" y1="160" x2="120" y2="150" stroke="#171717" stroke-width="1"/>
  <line x1="110" y1="180" x2="120" y2="170" stroke="#171717" stroke-width="1"/>
  <line x1="110" y1="200" x2="120" y2="190" stroke="#171717" stroke-width="1"/>
  <line x1="110" y1="220" x2="120" y2="210" stroke="#171717" stroke-width="1"/>
  <line x1="110" y1="240" x2="120" y2="230" stroke="#171717" stroke-width="1"/>
  <line x1="110" y1="260" x2="120" y2="250" stroke="#171717" stroke-width="1"/>
  <line x1="110" y1="280" x2="120" y2="270" stroke="#171717" stroke-width="1"/>
  <!-- Hatching right wall -->
  <line x1="380" y1="50" x2="390" y2="60" stroke="#171717" stroke-width="1"/>
  <line x1="380" y1="70" x2="390" y2="80" stroke="#171717" stroke-width="1"/>
  <line x1="380" y1="90" x2="390" y2="100" stroke="#171717" stroke-width="1"/>
  <line x1="380" y1="110" x2="390" y2="120" stroke="#171717" stroke-width="1"/>
  <line x1="380" y1="130" x2="390" y2="140" stroke="#171717" stroke-width="1"/>
  <line x1="380" y1="150" x2="390" y2="160" stroke="#171717" stroke-width="1"/>
  <line x1="380" y1="170" x2="390" y2="180" stroke="#171717" stroke-width="1"/>
  <line x1="380" y1="190" x2="390" y2="200" stroke="#171717" stroke-width="1"/>
  <line x1="380" y1="210" x2="390" y2="220" stroke="#171717" stroke-width="1"/>
  <line x1="380" y1="230" x2="390" y2="240" stroke="#171717" stroke-width="1"/>
  <line x1="380" y1="250" x2="390" y2="260" stroke="#171717" stroke-width="1"/>
  <line x1="380" y1="270" x2="390" y2="280" stroke="#171717" stroke-width="1"/>
  <!-- V=0 inside -->
  <line x1="120" y1="270" x2="380" y2="270" stroke="#171717" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Energy levels -->
  <line x1="150" y1="240" x2="350" y2="240" stroke="#404040" stroke-width="1" stroke-dasharray="6,3"/>
  <line x1="150" y1="195" x2="350" y2="195" stroke="#404040" stroke-width="1" stroke-dasharray="6,3"/>
  <line x1="150" y1="135" x2="350" y2="135" stroke="#404040" stroke-width="1" stroke-dasharray="6,3"/>
  <!-- Energy labels -->
  <text x="360" y="244" font-family="serif" font-size="13" fill="#525252" font-style="italic">E₁</text>
  <text x="360" y="199" font-family="serif" font-size="13" fill="#525252" font-style="italic">E₂</text>
  <text x="360" y="139" font-family="serif" font-size="13" fill="#525252" font-style="italic">E₃</text>
  <!-- Position labels -->
  <text x="113" y="290" font-family="serif" font-size="13" fill="#525252">0</text>
  <text x="373" y="290" font-family="serif" font-size="13" fill="#525252" font-style="italic">L</text>
  <!-- Infinity symbols -->
  <text x="85" y="55" font-family="serif" font-size="16" fill="#171717">∞</text>
  <text x="395" y="55" font-family="serif" font-size="16" fill="#171717">∞</text>
  <!-- V=0 label -->
  <text x="235" y="265" font-family="serif" font-size="13" fill="#737373" font-style="italic">V = 0</text>
</svg>
